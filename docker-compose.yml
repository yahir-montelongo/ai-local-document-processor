services:
  web:
    build: .
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_TIMEOUT=120
      - OLLAMA_NUM_CTX=4096
      - MAX_DOCUMENT_CHARS=50000
      - API_KEY=${API_KEY}
